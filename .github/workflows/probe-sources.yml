# One-off check: can GitHub's runners reach the official data sources?
# Plain requests only (no browser impersonation). Safe to delete after reading the log.
name: Probe data sources

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-sources.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check status codes
        run: |
          for u in \
            "https://www.opm.gov/policy-data-oversight/pay-leave/salaries-wages/salary-tables/26Tables/html/GS.aspx" \
            "https://www.opm.gov/policy-data-oversight/pay-leave/salaries-wages/salary-tables/26Tables/html/DCB.aspx" \
            "https://www.dfas.mil/MilitaryMembers/payentitlements/Pay-Tables/" \
            "https://www.travel.dod.mil/Allowances/Basic-Allowance-for-Housing/BAH-Rate-Lookup/" \
            "https://api.gsa.gov/travel/perdiem/v2/rates/conus/mie/2027?api_key=DEMO_KEY"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$u" || echo ERR)
            echo "$code  $u"
          done
